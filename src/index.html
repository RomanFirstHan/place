<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Place</title>
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body class="body">
    <header class="container header">
      <img width="142" src="images/header__logo.svg" alt="logo" />
      <hr class="divider" />
    </header>
    <main class="container main">
      <section class="profile">
        <img class="photo" src="images/Photo_petuha.jpg" alt="photo" />
        <div class="profile__info">
          <div class="profile__title">
            <div><h2 class="profile__name">Жак-Ив Кусто</h2></div>
            <button class="profile__edit-button"></button>
          </div>
          <p class="profile_subtitle">Исследователь океана</p>
        </div>
        <button class="profile__button"></button>
      </section>
      <section class="elements">
        <ul class="elements__list">
          <li>
            <article class="card">
              <img
                class="card__image"
                src="images/cards/kirill-pershin-1088404-unsplash.jpg"
              />
              <div class="card__info">
                <p class="card__title">Карачаевск</p>
                <button class="card__like-button" type="button"></button>
              </div>
            </article>
          </li>
          <li>
            <article class="card">
              <img
                class="card__image"
                src="images/cards/kirill-pershin-1404681-unsplash.png"
              />
              <div class="card__info">
                <p class="card__title">Гора Эльбрус</p>
                <button class="card__like-button" type="button"></button>
              </div>
            </article>
          </li>
          <li>
            <article class="card">
              <img
                class="card__image"
                src="images/cards/kirill-pershin-1556355-unsplash.png"
              />
              <div class="card__info">
                <p class="card__title">Домбай</p>
                <button class="card__like-button" type="button"></button>
              </div>
            </article>
          </li>
          <li>
            <article class="card">
              <img
                class="card__image"
                src="images/cards/kirill-pershin-1404681-unsplash.png"
              />
              <div class="card__info">
                <p class="card__title">Гора Эльбрус</p>
                <button class="card__like-button" type="button"></button>
              </div>
            </article>
          </li>
        </ul>
      </section>
    </main>
    <footer></footer>
    <script src="../script.js"></script>
  </body>
</html>
